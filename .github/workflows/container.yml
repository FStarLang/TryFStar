name: Publish playground image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".devcontainer/try-fstar/Dockerfile"
      - ".devcontainer/try-fstar/Dockerfile.dockerignore"
      - "website/playground/**/Makefile"
      - "website/playground/Makefile"
      - "website/playground/**/*.py"
      - "website/playground/**/*.fsx"
      - "website/playground/**/*.csproj"
      - "website/playground/**/*.props"
      - "website/playground/tutorial-compat/**"
      - "website/examples/**"
      - "website/tutorial/book/code/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: playground-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Choose registry name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build, check, and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: website
          file: .devcontainer/try-fstar/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TryFStar
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report immutable image reference
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo '## Published playground image'
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo 'For the first publication, make the GHCR package public in Package settings.'
            echo 'Confirm an anonymous pull succeeds before updating devcontainer.json to this digest.'
            echo 'Image rebuilds publish a new digest; they do not silently change the pinned Codespace.'
          } >> "$GITHUB_STEP_SUMMARY"
